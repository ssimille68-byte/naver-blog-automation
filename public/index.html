<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>네이버 블로그 자동화</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📝</text></svg>">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="logo">N</span><div><strong>네이버 블로그 자동화</strong><small>글감 수집 → AI 작성 → 이미지 검증 → 자동 발행</small></div></div>
  <div class="status-pills" id="statusPills"></div>
</header>

<nav class="tabs" id="tabs">
  <button data-tab="run" class="active">자동 실행</button>
  <button data-tab="topics">글감</button>
  <button data-tab="drafts">초안</button>
  <button data-tab="published">발행 기록</button>
  <button data-tab="settings">설정</button>
</nav>

<main>
  <!-- 자동 실행 -->
  <section class="panel active" data-panel="run">
    <div class="card">
      <h2>한 번에 실행</h2>
      <p class="hint">관심 분야만 넣으면 글감 찾기 → 글 작성 → 이미지 선별까지 한 번에 진행합니다.</p>
      <div class="row">
        <input id="autoInterest" type="text" placeholder="예: 홈카페 원두 추천, 2026 부동산 세금, 러닝 입문" />
        <button id="autoRun" class="primary">전자동 실행</button>
      </div>
      <label class="check"><input type="checkbox" id="autoPublish"> 완성되면 네이버 블로그에 바로 발행</label>
      <label class="check"><input type="checkbox" id="autoDryRun"> 발행 연습 모드 (에디터에 채우기만 하고 발행 안 함)</label>
    </div>

    <div class="card">
      <h2>네이버 계정</h2>
      <div id="loginBox" class="login-box"></div>
    </div>

    <div class="card job-card" id="jobCard" hidden>
      <h2>진행 중인 작업</h2>
      <div id="jobBody"></div>
    </div>
  </section>

  <!-- 글감 -->
  <section class="panel" data-panel="topics">
    <div class="card">
      <h2>글감 찾기</h2>
      <p class="hint">네이버 뉴스와 인기 블로그 글을 수집한 뒤, AI 가 쓸 만한 주제를 점수와 함께 추려 줍니다.</p>
      <div class="row">
        <input id="topicInterest" type="text" placeholder="관심 분야를 입력하세요" />
        <button id="topicDiscover" class="primary">글감 찾기</button>
      </div>
    </div>
    <div id="topicList" class="list"></div>
  </section>

  <!-- 초안 -->
  <section class="panel" data-panel="drafts">
    <div class="split">
      <div class="side">
        <h2>초안 목록</h2>
        <div id="draftList" class="list compact"></div>
      </div>
      <div class="detail" id="draftDetail">
        <div class="empty">왼쪽에서 초안을 선택하세요.</div>
      </div>
    </div>
  </section>

  <!-- 발행 기록 -->
  <section class="panel" data-panel="published">
    <div id="pubList" class="list"></div>
  </section>

  <!-- 설정 -->
  <section class="panel" data-panel="settings">
    <div class="card">
      <h2>설정</h2>
      <form id="settingsForm" class="form-grid"></form>
      <div class="row end"><button id="settingsSave" class="primary">설정 저장</button></div>
    </div>
  </section>
</main>

<aside class="console" id="console">
  <div class="console-head">
    <strong>실행 로그</strong>
    <div>
      <button id="logClear" class="ghost small">지우기</button>
      <button id="logToggle" class="ghost small">접기</button>
    </div>
  </div>
  <div class="console-body" id="logBody"></div>
</aside>

<div id="toasts" class="toasts"></div>
<script type="module" src="/js/app.js"></script>
</body>
</html>
